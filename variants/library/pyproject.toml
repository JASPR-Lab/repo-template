[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-name"
version = "0.1.0"
description = "TODO: one-line description"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "JASPR Lab, Dartmouth College" }]
maintainers = [{ name = "TODO maintainer name", email = "TODO@dartmouth.edu" }]
keywords = ["security", "privacy", "machine-learning"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.16", "pre-commit>=4", "build>=1.2", "twine>=6"]

[project.urls]
Homepage = "https://github.com/JASPR-Lab/project-name"
Repository = "https://github.com/JASPR-Lab/project-name"
Issues = "https://github.com/JASPR-Lab/project-name/issues"
Changelog = "https://github.com/JASPR-Lab/project-name/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
project_name = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=project_name --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["variants"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D", "ANN"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
