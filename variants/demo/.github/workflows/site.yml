name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: python scripts/build_site.py
      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site/
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && vars.DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  # Opt-in: set repository variable DEPLOY_PAGES=true and enable Pages (public repos only on GitHub Free).
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
