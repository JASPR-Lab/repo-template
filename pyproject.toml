[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-name"
version = "0.1.0"
description = "TODO: one-line description"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "JASPR Lab, Dartmouth College" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.16", "pre-commit>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["variants"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
